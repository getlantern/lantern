version: "2"

run:
  build-tags: [with_gvisor, with_quic, with_wireguard, with_utls, with_grpc]

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - gosec
    - nilerr
    - noctx
  settings:
    gosec:
      # File-permission and path-from-variable findings are noise for a client
      # that only writes its own data dir; G104 duplicates errcheck.
      excludes: [G104, G115, G301, G302, G304, G306]
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*"]
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [bodyclose, errcheck, gosec, noctx]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
