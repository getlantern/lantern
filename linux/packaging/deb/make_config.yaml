display_name: Lantern
package_name: Lantern
maintainer:
  name: teamlantern
  email: admin@getlantern.org

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/launch_icon.png

keywords:
  - Lantern

generic_name: Lantern

categories:
  - Network

startup_notify: true

postinstall_scripts:
  - getent group lantern >/dev/null 2>&1 || groupadd --system lantern
  - if [ -n "$SUDO_USER" ] && [ "$SUDO_USER" != "root" ] && id "$SUDO_USER" >/dev/null 2>&1; then usermod -a -G lantern "$SUDO_USER" || true; fi
  - systemctl daemon-reload
  - systemctl enable --now lantern.service || true

postuninstall_scripts:
  - systemctl disable lantern.service || true
  - systemctl daemon-reload
