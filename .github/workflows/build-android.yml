name: Build Android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_type:
        required: true
        type: string
      installer_base_name:
        required: true
        type: string
      android_identity_seed:
        required: false
        type: string
      stealth_leakage_mode:
        description: "Optional stealth leakage scan mode, for example stealth or stealth-novpn"
        required: false
        type: string
        default: ""
      obfuscate_go:
        description: "Build Android Go/native libraries through garble"
        required: false
        type: boolean
        default: false
    secrets:
      GRADLE_PROPERTIES:
        required: true
      APP_ENV:
        required: true
      KEYSTORE:
        required: true
      STEALTH_GARBLE_SEED:
        required: false

jobs:
  build-android:
    permissions:
      contents: "read"
      id-token: "write"
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      VERSION: ${{ inputs.version }}
    # Android needs no Apple tooling. Public Linux runners have 4 CPUs/16 GB,
    # versus 3 CPUs/7 GB on macOS ARM64, leaving more headroom for Gradle/R8.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pubspec.yaml
        uses: actions/download-artifact@v4
        with:
          name: pubspec

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: android
          gomobile-cache: "true"

      - name: Set up Android
        uses: ./.github/actions/setup-android

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Set gradle properties
        env:
          GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
        run: |
          mkdir -p ~/.gradle/
          echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
          echo "${GRADLE_PROPERTIES}" > ~/.gradle/gradle.properties

      - name: Decode APP_ENV
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "app.env"
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.APP_ENV }}

      - name: Decode Keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "keystore.release.jks"
          fileDir: "./android/app"
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Install dependencies (gomobile)
        run: |
          make install-android-deps
        env:
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}

      - name: Run stealth manifest filter tests
        run: make stealth-manifest-filter-test

      - name: Install garble
        if: ${{ inputs.obfuscate_go }}
        run: make install-garble

      - name: Build Android obfuscated (APK + AAB)
        if: ${{ inputs.obfuscate_go }}
        run: make android-release-ci-obfuscated
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION: ${{ inputs.version }}
          INSTALLER_NAME: ${{ inputs.installer_base_name }}
          ANDROID_IDENTITY_SEED: ${{ inputs.android_identity_seed }}
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}
          STEALTH_GARBLE_SEED: ${{ secrets.STEALTH_GARBLE_SEED }}

      - name: Build Android (APK + AAB)
        if: ${{ !inputs.obfuscate_go }}
        run: make android-release-ci
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION: ${{ inputs.version }}
          INSTALLER_NAME: ${{ inputs.installer_base_name }}
          ANDROID_IDENTITY_SEED: ${{ inputs.android_identity_seed }}
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}

      - name: Stealth leakage check
        id: stealth_leakage_check
        if: ${{ inputs.stealth_leakage_mode != '' }}
        shell: bash
        run: |
          set -o pipefail
          : > stealth-leakage-report.txt
          make stealth-leakage-check 2>&1 | tee stealth-leakage-report.txt
        env:
          STEALTH_LEAKAGE_MODE: ${{ inputs.stealth_leakage_mode }}
          STEALTH_LEAKAGE_MISSING_OK: "0"
          STEALTH_LEAKAGE_PATHS: >-
            ${{ inputs.installer_base_name }}${{ inputs.build_type != 'production' && format('-{0}', inputs.build_type) || '' }}.apk
            ${{ inputs.installer_base_name }}${{ inputs.build_type != 'production' && format('-{0}', inputs.build_type) || '' }}.aab

      - name: Upload stealth leakage report
        if: ${{ always() && inputs.stealth_leakage_mode != '' && steps.stealth_leakage_check.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: stealth-leakage-report
          path: stealth-leakage-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: lantern-installer-apk
          path: ${{ inputs.installer_base_name }}${{ inputs.build_type != 'production' && format('-{0}', inputs.build_type) || '' }}.apk
          retention-days: 2

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: lantern-installer-aab
          path: ${{ inputs.installer_base_name }}${{ inputs.build_type != 'production' && format('-{0}', inputs.build_type) || '' }}.aab
          retention-days: 2

      - name: Upload mapping.txt
        uses: actions/upload-artifact@v4
        with:
          name: play-mapping
          path: mapping.txt
          retention-days: 7

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: play-debug-symbols
          path: debug-symbols.zip
          retention-days: 7
