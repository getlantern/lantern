name: Linux install + desktop + daemon smoke test

on:
  workflow_call:
    inputs:
      installer_name:
        required: true
        type: string

jobs:
  linux-e2e-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: lantern-installer-deb
          path: ./artifacts

      - name: Install smoke test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb curl jq

      - name: Install .deb
        shell: bash
        run: |
          set -euxo pipefail
          ls -la ./artifacts

          expected="./artifacts/${{ inputs.installer_name }}.deb"
          if [[ -f "$expected" ]]; then
            deb="$expected"
          else
            shopt -s nullglob
            debs=(./artifacts/*.deb)
            shopt -u nullglob
            if [[ "${#debs[@]}" -eq 0 ]]; then
              echo "No .deb found in ./artifacts"
              exit 1
            fi
            deb="${debs[0]}"
          fi

          echo "Installing deb: $deb"
          sudo apt-get install -y "$deb"

      - name: Verify daemon starts and socket is ready
        shell: bash
        run: |
          set -euxo pipefail
          sudo systemctl daemon-reload
          sudo systemctl enable --now lanternd.service

          for i in $(seq 1 30); do
            if systemctl is-active --quiet lanternd.service; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet lanternd.service

          sock="/run/lantern/lanternd.sock"
          for i in $(seq 1 30); do
            if [[ -S "$sock" ]]; then
              break
            fi
            sleep 1
          done
          test -S "$sock"
          sudo ls -la "$sock"
          sudo stat -c "%a %U %G %n" "$sock"

      - name: Launch desktop app without sudo (xvfb)
        shell: bash
        run: |
          set -euxo pipefail
          test_user="lanternci"
          sudo useradd -m -s /bin/bash "$test_user" || true
          sudo usermod -aG lantern "$test_user"

          sudo -u "$test_user" bash -lc '
            set -euxo pipefail
            code=0
            xvfb-run -a timeout 15s /usr/bin/lantern >/tmp/lantern-ui.log 2>&1 || code=$?
            if [[ "$code" -ne 124 ]]; then
              cat /tmp/lantern-ui.log || true
              echo "Lantern UI did not stay up under xvfb"
              exit 1
            fi
          '

      - name: Non-root daemon IPC start/stop/status
        shell: bash
        run: |
          set -euxo pipefail
          test_user="lanternci"
          sock="/run/lantern/lanternd.sock"

          sudo -u "$test_user" bash -lc '
            set -euxo pipefail
            sock="'"$sock"'"

            curl --fail --silent --show-error --unix-socket "$sock" http://lantern/status >/tmp/lantern-status.json
            cat /tmp/lantern-status.json | jq .

            start_code="$(curl --silent --show-error --output /tmp/lantern-start.out --write-out "%{http_code}" \
              --unix-socket "$sock" \
              -H "Content-Type: application/json" \
              -X POST \
              --data "{\"groupTag\":\"\",\"outboundTag\":\"\"}" \
              http://lantern/service/start)"
            if [[ "$start_code" == "401" || "$start_code" == "403" || "$start_code" == "000" ]]; then
              cat /tmp/lantern-start.out || true
              echo "non-root start denied by IPC auth: $start_code"
              exit 1
            fi

            stop_code="$(curl --silent --show-error --output /tmp/lantern-stop.out --write-out "%{http_code}" \
              --unix-socket "$sock" \
              -X POST \
              http://lantern/service/stop)"
            if [[ "$stop_code" == "401" || "$stop_code" == "403" || "$stop_code" == "000" ]]; then
              cat /tmp/lantern-stop.out || true
              echo "non-root stop denied by IPC auth: $stop_code"
              exit 1
            fi
          '

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== lanternd.service status ==="
          sudo systemctl --no-pager status lanternd.service || true
          echo
          echo "=== journalctl (lanternd.service, last 300 lines) ==="
          sudo journalctl -u lanternd.service --no-pager --no-hostname -n 300 || true
          echo
          echo "=== /run/lantern listing ==="
          sudo ls -la /run/lantern || true
