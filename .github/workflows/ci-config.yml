name: CI configuration checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "scripts/ci/setup*.sh"
      - "scripts/ci/choco-retry.sh"
      - "scripts/ci/validate_composite_actions.rb"
      - "scripts/ci/verify_android_abis*"
      - "scripts/ci/verify_android_version*"
      - "scripts/ci/android_version_test.py"
      - "android/abi-targets.properties"
      - "Makefile"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=
      - name: Validate composite actions
        run: ruby scripts/ci/validate_composite_actions.rb
      - name: Test Android ABI artifact validation
        run: python3 -m unittest discover -s scripts/ci -p 'verify_android_abis_test.py' -v
      - name: Test Android version stamping and artifact validation
        run: python3 -m unittest discover -s scripts/ci -p '*android_version_test.py' -v
      - name: Check setup script syntax
        run: |
          bash -n .github/actions/setup-flutter/read-version.sh
          bash -n scripts/ci/choco-retry.sh
          bash -n scripts/ci/setup-windows-toolchain.sh
          bash -n scripts/ci/verify_android_version.sh
