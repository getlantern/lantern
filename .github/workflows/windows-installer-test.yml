name: Windows Installer Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - windows/packaging/exe/**
      - windows/runner/CMakeLists.txt
      - windows/runner/stage_vcredist.props
      - .github/scripts/test_windows_installer.py
      - .github/scripts/windows_installer_test.iss
      - .github/scripts/windows_smoke_suite.ps1
      - .github/scripts/windows_candidate_smoke.ps1
      - .github/scripts/windows_gui_health.ps1
      - .github/scripts/test_windows_gui_health.ps1
      - .github/scripts/windows_auto_update_smoke.ps1
      - .github/workflows/windows-installer-test.yml
      - .github/workflows/build-windows.yml
      - scripts/requirements.txt
      - scripts/ci/*windows*.ps1
      - scripts/ci/render_windows_installer*.py
      - scripts/ci/choco-retry.sh

permissions:
  contents: read

concurrency:
  group: windows-installer-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Inno Setup 6
        shell: bash
        run: ./scripts/ci/choco-retry.sh -y innosetup --version=6.7.1 --allow-downgrade

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install installer test dependencies
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install test dependencies' }

      - name: Test signature validation and GUI crash detection
        shell: pwsh
        run: |
          ./scripts/ci/windows-signing_test.ps1
          ./.github/scripts/test_windows_gui_health.ps1

      - name: Test toolchain staging and installer prerequisite behavior
        run: python .github/scripts/test_windows_installer.py --output "${{ runner.temp }}/lantern-installer-tests"

      - name: Upload installer test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test-diagnostics
          path: |
            ${{ runner.temp }}/lantern-installer-tests/*.iss
            ${{ runner.temp }}/lantern-installer-tests/*.log
            ${{ runner.temp }}/lantern-installer-tests/results.txt
            ${{ runner.temp }}/lantern-installer-tests/staging fixture/**/*.proj
            ${{ runner.temp }}/lantern-installer-tests/staging fixture/**/*.props
