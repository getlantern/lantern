name: Android Compile Check

# Build and verify both ARM ABIs and run native regression tests on relevant PRs.

on:
  workflow_dispatch:
    inputs:
      build_candidate:
        description: "Also build debug-signed release APK/AAB artifacts for testing"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "**/*.kt"
      - "android/**/*.gradle"
      - "android/abi-targets.properties"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "integration_test/**"
      - "scripts/ci/verify_android_abis*"
      - "scripts/ci/verify_android_hardening*"
      - "scripts/android/build-hardened-libcxx*"
      - "scripts/android/hardened-libcxx-sources.json"
      - "android/app/cpp/**"
      - "scripts/android/test-runtime-seccomp.py"
      - "scripts/android/runtime-seccomp/**"
      - "lantern-core/vpn_tunnel/**"
      - ".github/workflows/android-compile-check.yml"
      - ".github/workflows/android-abi-candidate.yml"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/firebase-test-lab.yml"
      - ".github/actions/setup-android/**"
      - ".github/actions/setup-flutter/**"
      - ".github/actions/setup-go/**"

concurrency:
  group: android-compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_candidate }}
    uses: ./.github/workflows/android-abi-candidate.yml
    secrets: inherit

  compile-check:
    permissions:
      contents: "read"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: android-check
          gomobile-cache: "true"

      - name: Verify Android TUN reader shutdown
        run: go test -tags with_gvisor ./lantern-core/vpn_tunnel -count=1

      - name: Verify 32-bit Go startup under seccomp
        run: python3 scripts/android/test-runtime-seccomp.py

      - name: Set up Android
        uses: ./.github/actions/setup-android

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Cache Android AAR
        id: android-aar-cache
        uses: actions/cache@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            bin/android/liblantern.aar
            bin/android/.abis
            android/app/libs/liblantern.aar
          key: ${{ runner.os }}-android-aar-dual-v2-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'android/abi-targets.properties', '**/*.go', '.github/actions/setup-android/**', '.github/actions/setup-flutter/**', '.github/actions/setup-go/**') }}

      - name: Mark restored Android AAR fresh
        if: steps.android-aar-cache.outputs.cache-hit == 'true'
        run: |
          test -s bin/android/liblantern.aar
          test -s android/app/libs/liblantern.aar
          test -s bin/android/.abis
          touch bin/android/.abis
          touch bin/android/liblantern.aar android/app/libs/liblantern.aar
          python3 scripts/ci/verify_android_abis.py --expected-abis "$(sed -n 's/^android.abis=//p' android/abi-targets.properties)" \
            --aar bin/android/liblantern.aar --aar android/app/libs/liblantern.aar
          python3 scripts/ci/verify_android_hardening.py \
            --aar bin/android/liblantern.aar --aar android/app/libs/liblantern.aar

      - name: Install dependencies (gomobile)
        if: steps.android-aar-cache.outputs.cache-hit != 'true'
        run: make install-android-deps
        env:
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}

      - name: Flutter pub get + codegen
        run: |
          make pubget
          make gen

      # Satisfy the pubspec asset declaration for this compile-only build.
      - name: Create placeholder app.env
        run: touch app.env

      - name: Build debug APK
        run: make android-debug-ci
        env:
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}

      - name: Verify Flutter device target configuration
        working-directory: android
        run: |
          # Device runs pass one ABI; build.gradle must widen it to the shared list.
          expected=$(sed -n 's/^android.abis=//p' abi-targets.properties | sed 's/armeabi-v7a/android-arm/;s/arm64-v8a/android-arm64/')
          for target in android-arm android-arm64; do
            actual=$(./gradlew -q :app:properties -Ptarget-platform="$target" | sed -n 's/^target-platform: //p')
            if [ "$actual" != "$expected" ]; then
              echo "::error::-Ptarget-platform=$target resolved to '$actual', expected '$expected'"
              exit 1
            fi
          done

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Compile architecture smoke instrumentation
        run: make android-integration-apks ANDROID_INTEGRATION_TARGET=integration_test/android_architecture_smoke_test.dart

      - name: Verify both native architectures in AAR and APK
        run: |
          python3 scripts/ci/verify_android_abis.py --expected-abis "$(sed -n 's/^android.abis=//p' android/abi-targets.properties)" \
            --aar bin/android/liblantern.aar --aar android/app/libs/liblantern.aar \
            --apk build/app/outputs/flutter-apk/app-debug.apk \
            --apk build/app/outputs/apk/debug/app-debug.apk
