name: Windows migration E2E harness checks

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'scripts/migration-e2e/**'
      - '.github/workflows/*migration-e2e*'
      - '.github/workflows/build-windows.yml'
      - 'windows/packaging/exe/inno_setup.iss'
  workflow_dispatch:
    inputs:
      cloud_sha:
        description: Optional full Cloud controller commit to check on Windows
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: migration-e2e-probe
      - name: Validate bundle and staging installer guards
        run: python -m unittest discover -s scripts/migration-e2e -p '*_test.py' -v
      - name: Check harness parsing, atomic read sharing and diagnostic errors
        shell: pwsh
        run: ./scripts/migration-e2e/harness_checks.ps1
      - name: Validate optional Cloud commit
        if: inputs.cloud_sha != ''
        shell: pwsh
        env:
          CLOUD_SHA: ${{ inputs.cloud_sha }}
        run: |
          if ($env:CLOUD_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Expected a full Cloud commit' }
      - uses: actions/checkout@v4
        if: inputs.cloud_sha != ''
        with:
          repository: getlantern/lantern-cloud
          ref: ${{ inputs.cloud_sha }}
          token: ${{ secrets.GH_TEAMLANTERN_TOKEN }}
          path: cloud-checks
          sparse-checkout: scripts/windows-migration
          persist-credentials: false
      - name: Check Cloud runner and reboot guards
        if: inputs.cloud_sha != ''
        shell: pwsh
        run: ./cloud-checks/scripts/windows-migration/checks.ps1
      - name: Test and build the real IPC probe
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test -tags with_clash_api ./scripts/migration-e2e/probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -tags with_clash_api -o migration-probe.exe ./scripts/migration-e2e/probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: migration-probe-windows-amd64
          path: migration-probe.exe
          if-no-files-found: error
          retention-days: 7
