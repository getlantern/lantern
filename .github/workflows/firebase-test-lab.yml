name: Firebase Test Lab (Android)

on:
  workflow_dispatch:
  # TODO: remove after merge to main — workflow_dispatch is unavailable in the
  # Actions UI until this file lands on the default branch.
  push:
    branches:
      - jigar/android-test-ci

permissions:
  contents: read

concurrency:
  group: ftl-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ftl-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: "gradle"
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # android/gradlew is gitignored, so install a matching Gradle on the
      # runner instead (keep the version in sync with
      # android/gradle/wrapper/gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          make install-android-sdk
          make android-env >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2.22.0
        with:
          channel: stable
          flutter-version-file: .github/flutter-version.yaml
          cache: true

      - name: Decode APP_ENV
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "app.env"
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.APP_ENV }}

      - name: Set gomobile cache dir
        shell: bash
        run: |
          echo "GOMOBILECACHE=$HOME/.cache/gomobile" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/gomobile"

      - name: Cache gomobile
        uses: actions/cache@v4
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: ~/.cache/gomobile
          key: ${{ runner.os }}-gomobile-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomobile-

      - name: Install dependencies (gomobile)
        run: make install-android-deps

      - name: Fetch packages and generate code
        run: make pubget gen

      - name: Build liblantern.aar
        run: make android

      - name: Build integration test APKs (app + androidTest)
        run: make android-integration-apks ANDROID_GRADLE=gradle

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run tests on Firebase Test Lab
        shell: bash
        run: |
          set -euxo pipefail
          gcloud firebase test android run \
            --project "${{ steps.gcp-auth.outputs.project_id }}" \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device "model=shiba,version=34,locale=en,orientation=portrait" \
            --device "model=lynx,version=33,locale=en_US,orientation=portrait" \
            --num-flaky-test-attempts=2 \
            --timeout 20m \
            --results-history-name "lantern-android-integration"
