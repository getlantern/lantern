name: Firebase Test Lab (Android)

# Runs Flutter integration tests (integration_test/) on real devices in
# Firebase Test Lab as Android instrumentation tests. The VpnService consent
# dialog is pre-granted by the instrumentation wrapper
# (android/app/src/androidTest), so VPN connect smokes run unattended.
#
# Required repository secrets:
#   FTL_GCP_SA_KEY  - JSON key of a service account in the Firebase project
#                     with the "Firebase Test Lab Admin" role
#   FTL_GCP_PROJECT - the Firebase/GCP project id
#   APP_ENV         - same app.env used by build-android.yml

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: "Integration test entrypoint to run"
        required: true
        type: choice
        options:
          - integration_test/android_all_e2e_test.dart
          - integration_test/vpn/android_vpn_smoke_test.dart
          - integration_test/auth/auth_smoke_test.dart
        default: integration_test/android_all_e2e_test.dart
      device_model:
        description: "FTL device model id (gcloud firebase test android models list)"
        required: false
        type: string
        default: shiba
      device_version:
        description: "Android API level of the FTL device"
        required: false
        type: string
        default: "34"
      enable_ip_check:
        description: "Validate public IP change during VPN connect smoke"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ftl-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ftl-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: "gradle"
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          make install-android-sdk
          make android-env >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2.22.0
        with:
          channel: stable
          flutter-version-file: .github/flutter-version.yaml
          cache: true

      - name: Decode APP_ENV
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "app.env"
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.APP_ENV }}

      - name: Set gomobile cache dir
        shell: bash
        run: |
          echo "GOMOBILECACHE=$HOME/.cache/gomobile" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/gomobile"

      - name: Cache gomobile
        uses: actions/cache@v4
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: ~/.cache/gomobile
          key: ${{ runner.os }}-gomobile-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomobile-

      - name: Install dependencies (gomobile)
        run: make install-android-deps

      - name: Fetch packages and generate code
        run: make pubget gen

      - name: Build liblantern.aar
        run: make android

      - name: Build integration test APKs (app + androidTest)
        shell: bash
        run: |
          set -euxo pipefail
          DART_DEFINES=""
          if [[ "${{ inputs.enable_ip_check }}" == "true" ]]; then
            DART_DEFINES="-Pdart-defines=$(echo -n 'ENABLE_IP_CHECK=true' | base64 -w0)"
          fi
          make android-integration-apks \
            ANDROID_INTEGRATION_TARGET="${{ inputs.test_target }}" \
            ANDROID_INTEGRATION_DART_DEFINES="$DART_DEFINES"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FTL_GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run tests on Firebase Test Lab
        shell: bash
        run: |
          set -euxo pipefail
          gcloud firebase test android run \
            --project "${{ secrets.FTL_GCP_PROJECT }}" \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device "model=${{ inputs.device_model }},version=${{ inputs.device_version }},locale=en,orientation=portrait" \
            --timeout 20m \
            --results-history-name "lantern-android-integration"
