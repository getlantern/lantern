name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_type:
        required: true
        type: string
      installer_base_name:
        required: true
        type: string

jobs:
  build-macos:
    permissions:
      contents: "read"
      id-token: "write"
    env:
      AC_USERNAME: ${{ secrets.AC_USERNAME }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      BUILD_TYPE: ${{ inputs.build_type }}
      VERSION: ${{ inputs.version }}
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pubspec.yaml
        uses: actions/download-artifact@v4
        with:
          name: pubspec

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-    

      - name: Cache macOS CocoaPods
        uses: actions/cache@v4
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: |
            macos/Pods
          key: ${{ runner.os }}-macos-pods-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-macos-pods-          

      - name: Install Flutter
        uses: subosito/flutter-action@v2.22.0
        with:
          channel: stable
          flutter-version-file: .github/flutter-version.yaml

      - name: Decode APP_ENV
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "app.env"
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.APP_ENV }}

      - name: Install node on macOS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Code Signing Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_BNS_CERT }}
          p12-password: ${{ secrets.MACOS_BNS_CERT_PASS }}

      - name: Install provisioning profiles for macOS
        env:
          BUILD_MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          BUILD_MACOS_TUNNEL_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_TUNNEL_BASE64 }}
        run: |
          PROVISIONING_PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROVISIONING_PROFILES_DIR"

          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          PT_PATH=$RUNNER_TEMP/build_pt.provisionprofile

          echo -n "$BUILD_MACOS_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$BUILD_MACOS_TUNNEL_PROFILE_BASE64" | base64 --decode -o $PT_PATH

          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PT_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Enable Flutter Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Set gomobile cache dir
        shell: bash
        run: |
          echo "GOMOBILECACHE=$HOME/.cache/gomobile" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/gomobile"

      - name: Cache gomobile
        uses: actions/cache@v4
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: ~/.cache/gomobile
          key: ${{ runner.os }}-gomobile-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomobile-

      - name: Install dependencies
        run: make install-macos-deps
        env:
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}

      - name: Run macOS unit tests
        run: make macos-unit-tests

      - name: Build macOS release
        run: make macos-release
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION: ${{ inputs.version }}
          INSTALLER_NAME: ${{ inputs.installer_base_name }}
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}

      - name: Check system extension build number monotonicity
        if: ${{ inputs.build_type == 'nightly' }}
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          INSTALLER_BASE_NAME: ${{ inputs.installer_base_name }}
          BUCKET: ${{ vars.S3_RELEASES_BUCKET }}
        run: |
          set -euo pipefail

          full_name="${INSTALLER_BASE_NAME}"
          if [[ "$BUILD_TYPE" != "production" ]]; then
            full_name="${full_name}-${BUILD_TYPE}"
          fi

          current_dmg="${full_name}.dmg"
          if [[ ! -f "$current_dmg" ]]; then
            echo "Current DMG not found: $current_dmg" >&2
            exit 1
          fi

          previous_dmg="$RUNNER_TEMP/previous-lantern.dmg"
          previous_url="https://${BUCKET}.s3.amazonaws.com/releases/${BUILD_TYPE}/latest/${full_name}.dmg"

          if ! curl -fLsS --retry 3 --retry-delay 2 -o "$previous_dmg" "$previous_url"; then
            echo "No previous DMG at $previous_url; skipping check."
            exit 0
          fi

          current_mount="$RUNNER_TEMP/current-dmg"
          previous_mount="$RUNNER_TEMP/previous-dmg"
          mkdir -p "$current_mount" "$previous_mount"

          detach_if_mounted() {
            local mountpoint="$1"
            if mount | grep -Fq "on ${mountpoint} "; then
              hdiutil detach "$mountpoint" -quiet || true
            fi
          }
          trap 'detach_if_mounted "$current_mount"; detach_if_mounted "$previous_mount"' EXIT

          hdiutil attach "$current_dmg" -mountpoint "$current_mount" -nobrowse -quiet
          hdiutil attach "$previous_dmg" -mountpoint "$previous_mount" -nobrowse -quiet

          find_plist() {
            find "$1" -path "*/SystemExtensions/org.getlantern.lantern.PacketTunnel.systemextension/Contents/Info.plist" -print -quit
          }

          current_plist="$(find_plist "$current_mount")"
          previous_plist="$(find_plist "$previous_mount")"
          if [[ -z "$current_plist" || -z "$previous_plist" ]]; then
            echo "Could not find system extension Info.plist in one of the DMGs." >&2
            exit 1
          fi

          current_build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$current_plist")
          previous_build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$previous_plist")

          echo "Previous sysext CFBundleVersion: $previous_build"
          echo "Current sysext CFBundleVersion:  $current_build"

          if [[ "$previous_build" =~ ^[0-9]+$ && "$current_build" =~ ^[0-9]+$ ]]; then
            if (( current_build <= previous_build )); then
              echo "Current sysext build number must be greater than previous latest." >&2
              exit 1
            fi
          elif [[ "$current_build" == "$previous_build" ]]; then
            echo "Current sysext build number must change from previous latest." >&2
            exit 1
          fi

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: lantern-installer-dmg
          path: ${{ inputs.installer_base_name }}${{ inputs.build_type != 'production' && format('-{0}', inputs.build_type) || '' }}.dmg
          retention-days: 2
