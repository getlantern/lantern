name: Build macOS

on:
  workflow_call:
    secrets:
      AC_USERNAME:
        required: true
      AC_PASSWORD:
        required: true
      APP_ENV:
        required: true
      MACOS_BNS_CERT:
        required: true
      MACOS_BNS_CERT_PASS:
        required: true
      MACOS_PROVISION_PROFILE_BASE64:
        required: true
      MACOS_PROVISION_TUNNEL_BASE64:
        required: true
      SPARKLE_ED_PRIVATE_KEY:
        required: false
      # Base64 of integration_test/auth/auth_smoke_credentials.dart; only
      # needed when run_auth_smoke is true.
      AUTH_SMOKE_CREDENTIALS:
        required: false
    inputs:
      version:
        required: true
        type: string
      build_type:
        required: true
        type: string
      installer_base_name:
        required: true
        type: string
      runner_label:
        description: "GitHub Actions runner label"
        required: false
        type: string
        default: macos-15
      flutter_target:
        description: "Optional Flutter entrypoint used to build the app"
        required: false
        type: string
        default: ""
      flutter_build_mode:
        description: "Flutter build mode: release or profile"
        required: false
        type: string
        default: release
      pubspec_artifact:
        description: "Artifact containing the version-stamped pubspec.yaml"
        required: false
        type: string
        default: pubspec
      sign_update_artifact:
        description: "Generate the Sparkle signature published with this DMG"
        required: false
        type: boolean
        default: true
      auto_update_e2e:
        description: "Build a fixture that reads the isolated staging appcast"
        required: false
        type: boolean
        default: false
      run_connect_smoke:
        description: "Run the macOS connect/disconnect smoke after building"
        required: false
        type: boolean
        default: false
      run_payment_smoke:
        description: "Verify staging Stripe Checkout in a Flutter integration test"
        required: false
        type: boolean
        default: false
      run_auth_smoke:
        description: "Run macOS auth smoke integration tests"
        required: false
        type: boolean
        default: false
      enable_ip_check:
        description: "Validate public IP change during the connect smoke"
        required: false
        type: boolean
        default: false
      force_full_tunnel_smoke:
        description: "Force full tunnel routing during the connect smoke"
        required: false
        type: boolean
        default: true
      extension_timeout_seconds:
        description: "Seconds to wait for System Extension activation"
        required: false
        type: number
        default: 120
jobs:
  build-macos:
    permissions:
      contents: "read"
      id-token: "write"
    env:
      AC_USERNAME: ${{ secrets.AC_USERNAME }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      BUILD_TYPE: ${{ inputs.build_type }}
      VERSION: ${{ inputs.version }}
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download pubspec.yaml
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.pubspec_artifact }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache macOS CocoaPods
        uses: actions/cache@v4
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: |
            macos/Pods
          key: ${{ runner.os }}-macos-pods-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-macos-pods-          

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version-file: .github/flutter-version.yaml

      - name: Decode APP_ENV
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "app.env"
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.APP_ENV }}

      - name: Install node on macOS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Code Signing Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_BNS_CERT }}
          p12-password: ${{ secrets.MACOS_BNS_CERT_PASS }}

      - name: Install Developer ID intermediate
        if: ${{ inputs.runner_label == 'lantern-macos-smoke' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c

          if ! security find-certificate -a -Z /Library/Keychains/System.keychain \
            | grep -qi '5B45F61068B29FCC8FFFF1A7E99B78DA9E9C4635'; then
            sudo security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
              -k /Library/Keychains/System.keychain
          fi
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k signing_temp.keychain

      - name: Verify signing identity
        shell: bash
        run: |
          security find-identity -p codesigning \
            | grep -F "ACZRKC3LQ9"

      - name: Install provisioning profiles for macOS
        env:
          BUILD_MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          BUILD_MACOS_TUNNEL_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_TUNNEL_BASE64 }}
        run: |
          PROVISIONING_PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROVISIONING_PROFILES_DIR"

          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          PT_PATH=$RUNNER_TEMP/build_pt.provisionprofile

          echo -n "$BUILD_MACOS_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$BUILD_MACOS_TUNNEL_PROFILE_BASE64" | base64 --decode -o $PT_PATH

          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PT_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Enable Flutter Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Set gomobile cache dir
        shell: bash
        run: |
          echo "GOMOBILECACHE=$HOME/.cache/gomobile" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/gomobile"

      - name: Cache gomobile
        uses: actions/cache@v4
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: ~/.cache/gomobile
          key: ${{ runner.os }}-gomobile-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomobile-

      - name: Install dependencies
        run: make install-macos-deps
        env:
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}

      - name: Run macOS unit tests
        run: make macos-unit-tests

      - name: macOS payment smoke
        if: ${{ inputs.run_payment_smoke }}
        timeout-minutes: 15
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/macos-payment-smoke
        run: bash ./.github/scripts/macos_payment_smoke.sh

      - name: Upload macOS payment smoke diagnostics
        if: ${{ always() && inputs.run_payment_smoke }}
        id: payment_smoke_diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: macos-payment-smoke
          path: ${{ runner.temp }}/macos-payment-smoke
          if-no-files-found: ignore
          retention-days: 2

      - name: Log macOS payment smoke diagnostics URL
        if: ${{ always() && steps.payment_smoke_diagnostics.outputs.artifact-url != '' }}
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.payment_smoke_diagnostics.outputs.artifact-url }}
        run: |
          echo "::notice title=macOS payment smoke diagnostics::$ARTIFACT_URL"
          echo "[Download the macOS payment smoke screenshot and diagnostics]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

      # Gitignored; the auth smoke suite does not compile without it.
      - name: Write auth smoke credentials
        if: ${{ inputs.run_auth_smoke }}
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "auth_smoke_credentials.dart"
          fileDir: ${{ github.workspace }}/integration_test/auth
          encodedString: ${{ secrets.AUTH_SMOKE_CREDENTIALS }}

      # The self-hosted runner persists between runs; the sign-up scenario
      # requires a fresh anonymous account (unpassRegistered guard), so reset
      # the app data directory first.
      - name: Reset Lantern app data
        if: ${{ inputs.run_auth_smoke }}
        shell: bash
        run: rm -rf /Users/Shared/Lantern || sudo rm -rf /Users/Shared/Lantern

      - name: macOS UI auth smoke integration
        if: ${{ inputs.run_auth_smoke }}
        timeout-minutes: 15
        shell: bash
        run: |
          flutter test integration_test/auth/auth_smoke_test.dart -d macos --reporter=expanded --dart-define=DISABLE_SYSTEM_TRAY=true

      - name: Build macOS app
        shell: bash
        run: |
          case "$FLUTTER_BUILD_MODE" in
            release) make macos-release-ci ;;
            profile) make macos-profile-ci ;;
            *)
              printf 'Unsupported macOS Flutter build mode: %s\n' "$FLUTTER_BUILD_MODE" >&2
              exit 2
              ;;
          esac
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          AUTO_UPDATE_E2E: ${{ inputs.auto_update_e2e }}
          FLUTTER_BUILD_MODE: ${{ inputs.flutter_build_mode }}
          FLUTTER_TARGET: ${{ inputs.flutter_target }}
          VERSION: ${{ inputs.version }}
          INSTALLER_NAME: ${{ inputs.installer_base_name }}
          GOMOBILECACHE: ${{ env.GOMOBILECACHE }}

      - name: Check system extension build number monotonicity
        if: ${{ inputs.build_type == 'nightly' }}
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          INSTALLER_BASE_NAME: ${{ inputs.installer_base_name }}
          BUCKET: ${{ vars.S3_RELEASES_BUCKET }}
        run: bash ./.github/scripts/check_macos_sysext_build.sh

      - name: Package macOS app artifact
        shell: bash
        run: |
          APP_PATH="build/macos/Build/Products/Release/Lantern.app"
          if [[ ! -d "$APP_PATH" ]]; then
            printf 'Lantern.app not found at %s\n' "$APP_PATH" >&2
            exit 1
          fi

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Lantern.app.zip"

      - name: Sign macOS update
        if: ${{ inputs.build_type != 'nightly' && inputs.sign_update_artifact }}
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG_PATH: ${{ inputs.installer_base_name }}${{ inputs.build_type != 'production' && format('-{0}', inputs.build_type) || '' }}.dmg
        run: |
          bash ./.github/scripts/sign_macos_update.sh \
            "$DMG_PATH" \
            "$RUNNER_TEMP/$(basename "$DMG_PATH").sparkle-signature"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: lantern-macos-app
          path: ${{ runner.temp }}/Lantern.app.zip
          retention-days: 2

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: lantern-installer-dmg
          path: ${{ inputs.installer_base_name }}${{ inputs.build_type != 'production' && format('-{0}', inputs.build_type) || '' }}.dmg
          retention-days: 2

      - name: Upload macOS update signature
        if: ${{ inputs.build_type != 'nightly' && inputs.sign_update_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: lantern-installer-dmg-signature
          path: ${{ runner.temp }}/${{ inputs.installer_base_name }}${{ inputs.build_type != 'production' && format('-{0}', inputs.build_type) || '' }}.dmg.sparkle-signature
          retention-days: 2

      - name: Run macOS connect smoke
        if: ${{ inputs.run_connect_smoke }}
        timeout-minutes: 30
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/macos-smoke-artifacts
          DMG_ARTIFACT_DIR: ${{ github.workspace }}
          ENABLE_IP_CHECK: ${{ inputs.enable_ip_check }}
          FORCE_FULL_TUNNEL: ${{ inputs.force_full_tunnel_smoke }}
          EXTENSION_TIMEOUT_SECONDS: ${{ inputs.extension_timeout_seconds }}
          RUN_CONNECT_SMOKE: true
        run: ./.github/scripts/macos_smoke_suite.sh

      - name: Upload macOS smoke diagnostics
        if: ${{ always() && inputs.run_connect_smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-diagnostics
          path: ${{ runner.temp }}/macos-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain signing_temp.keychain 2>/dev/null || true

      - name: Remove provisioning profiles
        if: ${{ always() && inputs.runner_label == 'lantern-macos-smoke' }}
        shell: bash
        run: |
          rm -f \
            "$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.provisionprofile" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/build_pt.provisionprofile"
