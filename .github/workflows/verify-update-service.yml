name: Verify Update Service

on:
  pull_request:
    paths:
      - "scripts/ci/**"
      - "scripts/requirements.txt"
      - ".github/workflows/release.yml"
      - ".github/workflows/verify-update-service.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to verify, with or without leading v"
        required: true
        type: string
      sparkle_version:
        description: "Desktop bundle build number to verify"
        required: false
        type: string
        default: ""
      channel:
        description: "Release channel to verify"
        required: false
        type: choice
        options:
          - stable
          - beta
        default: beta
      platform:
        description: "Release platform to verify ('all' or comma-separated platforms)"
        required: false
        type: string
        default: all
      linux_arch:
        description: "Linux architectures to verify"
        type: choice
        options: [all, amd64, arm64]
        default: all
      update_url:
        description: "Lantern update endpoint"
        required: false
        type: string
        default: "https://update.getlantern.org/update/lantern"
      asset_base_url:
        description: "Expected public directory containing the promoted assets"
        required: false
        type: string
        default: ""
      timeout_seconds:
        description: "How long to poll the update service"
        required: false
        type: number
        default: 2700
      interval_seconds:
        description: "Delay between polling attempts"
        required: false
        type: number
        default: 60
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sparkle_version:
        required: false
        type: string
        default: ""
      channel:
        required: false
        type: string
        default: beta
      platform:
        required: false
        type: string
        default: all
      linux_arch:
        type: string
        default: all
      update_url:
        required: false
        type: string
        default: "https://update.getlantern.org/update/lantern"
      asset_base_url:
        required: false
        type: string
        default: ""
      timeout_seconds:
        required: false
        type: number
        default: 2700
      interval_seconds:
        required: false
        type: number
        default: 60

permissions:
  contents: read

concurrency:
  group: verify-update-service-${{ github.ref }}-${{ inputs.channel }}-${{ inputs.platform }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python3 -m pip install -r scripts/requirements.txt PyYAML
      - name: Test release tooling
        run: |
          python3 -m unittest \
            scripts/ci/generate_update_metadata_test.py \
            scripts/ci/verify_release_alignment_test.py \
            scripts/ci/verify_update_service_test.py \
            scripts/ci/release_workflow_test.py
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=

      - name: Run update service verifier
        if: github.event_name != 'pull_request'
        env:
          UPDATE_URL: ${{ inputs.update_url }}
          ASSET_BASE_URL: ${{ inputs.asset_base_url }}
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ inputs.platform }}
          LINUX_ARCH: ${{ inputs.linux_arch }}
          VERSION: ${{ inputs.version }}
          SPARKLE_VERSION: ${{ inputs.sparkle_version }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
        run: |
          python3 scripts/ci/verify_update_service.py \
            --update-url "$UPDATE_URL" \
            --asset-base-url "$ASSET_BASE_URL" \
            --channel "$CHANNEL" \
            --platform "$PLATFORM" \
            --linux-arch "$LINUX_ARCH" \
            --version "$VERSION" \
            --sparkle-version "$SPARKLE_VERSION" \
            --timeout-seconds "$TIMEOUT_SECONDS" \
            --interval-seconds "$INTERVAL_SECONDS"
