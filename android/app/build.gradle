plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def hasRelProp = { name -> project.hasProperty(name) && project.property(name)?.toString()?.trim() }
def hasReleaseKeystore =
        hasRelProp('KEYSTORE_FILE') &&
        hasRelProp('KEYSTORE_PWD') &&
        hasRelProp('KEY_ALIAS') &&
        hasRelProp('KEY_PWD')

def start = new Date(2015, 1, 1).getTime()
def now = System.currentTimeMillis()
def code = (int)((now - start) / 1000)

android {
    namespace = "org.getlantern.lantern"
    compileSdk = 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path "cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // The sideload APK target (Makefile android-apk-release) passes
    // -Plantern.thinAbi=true so this build emits only arm64. The AAB
    // target leaves the property unset so Play Store users on legacy
    // 32-bit ARM devices still receive updates via per-ABI splits.
    //
    // Constraint: the ABIs listed in abiFilters must match the ABIs
    // Flutter actually built (Makefile's --target-platform flag).
    // Listing an ABI here that Flutter didn't build crashes installs on
    // that architecture with "Could not find 'libflutter.so'".
    def thinAbi = project.findProperty("lantern.thinAbi") == "true"

    // Use legacy packaging to helps reduce apk size
    packagingOptions {
        exclude "DebugProbesKt.bin"
        jniLibs {
            useLegacyPackaging true
            // abiFilters is supposed to keep only the ABIs we ship to in
            // the APK, but some transitive AAR dependencies (notably ML
            // Kit's barcode-scanning AAR pre-unbundling) ship x86 / x86_64
            // .so files that slip past the filter — observed 5.9 MB
            // libbarhopper_v3.so + 1.2 MB libc++_shared.so + 0.7 MB
            // libnative-imagetranscoder.so under lib/x86_64/ in
            // v9.1.9-beta. Explicit excludes here strip them at packaging
            // time. When lantern.thinAbi is set the sideload APK also
            // strips armeabi-v7a; the AAB build leaves it in.
            def abiExcludes = [
                "lib/x86/**",
                "lib/x86_64/**",
                "lib/armeabi/**",
                "lib/mips/**",
                "lib/mips64/**",
            ]
            if (thinAbi) {
                abiExcludes += "lib/armeabi-v7a/**"
            }
            excludes += abiExcludes
        }
    }

    defaultConfig {
        applicationId = "org.getlantern.lantern"
        minSdkVersion = 24
        targetSdk = 36
        versionCode = code
        versionName = flutter.versionName

        ndk {
            // ABI set must match what Flutter built (Makefile's
            // --target-platform). Sideload APK: arm64 only
            // (-Plantern.thinAbi=true). AAB: arm64 + armeabi-v7a so Play
            // Store users on legacy 32-bit hardware still get updates.
            abiFilters = thinAbi ? ["arm64-v8a"] : ["arm64-v8a", "armeabi-v7a"]
            debugSymbolLevel 'FULL'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14 -fexceptions -frtti"
                arguments "-DANDROID_ARM_NEON=TRUE", '-DANDROID_STL=c++_shared'
            }
        }
        buildFeatures {
            buildConfig true
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(project.property('KEYSTORE_FILE'))
                storePassword project.property('KEYSTORE_PWD')
                keyAlias project.property('KEY_ALIAS')
                keyPassword project.property('KEY_PWD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "DEVELOPMENT_MODE", "true"
        }

        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            buildConfigField "boolean", "DEVELOPMENT_MODE", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

flutter {
    source = "../.."
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation fileTree(dir: "libs", include: "liblantern.aar")
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
