plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def hasRelProp = { name -> project.hasProperty(name) && project.property(name)?.toString()?.trim() }
def hasReleaseKeystore =
        hasRelProp('KEYSTORE_FILE') &&
        hasRelProp('KEYSTORE_PWD') &&
        hasRelProp('KEY_ALIAS') &&
        hasRelProp('KEY_PWD')

def start = new Date(2015, 1, 1).getTime()
def now = System.currentTimeMillis()
def code = (int)((now - start) / 1000)

android {
    namespace = "org.getlantern.lantern"
    compileSdk = 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path "cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Use legacy packaging to helps reduce apk size
    packagingOptions {
        exclude "DebugProbesKt.bin"
        jniLibs {
            useLegacyPackaging true
            // abiFilters above is meant to keep only arm64-v8a in the APK,
            // but some transitive AAR dependencies (notably ML Kit's
            // barcode-scanning AAR pre-unbundling) ship x86 / x86_64 /
            // armeabi .so files that slip past the filter — observed
            // 5.9 MB libbarhopper_v3.so + 1.2 MB libc++_shared.so +
            // 0.7 MB libnative-imagetranscoder.so under lib/x86_64/ in
            // v9.1.9-beta. Explicit excludes here strip them at packaging
            // time so the produced APK has only the ABI(s) we ship for.
            excludes += [
                "lib/x86/**",
                "lib/x86_64/**",
                "lib/armeabi/**",
                "lib/armeabi-v7a/**",
                "lib/mips/**",
                "lib/mips64/**",
            ]
        }
    }

    defaultConfig {
        applicationId = "org.getlantern.lantern"
        minSdkVersion = 24
        targetSdk = 36
        versionCode = code
        versionName = flutter.versionName

        ndk {
            // Must match the ABIs Flutter actually builds (ANDROID_TARGET_PLATFORMS
            // in the top-level Makefile). Listing an ABI here that Flutter
            // didn't build for produces an empty per-ABI split on Play and
            // crashes installs on that architecture with "Could not find
            // 'libflutter.so'".
            //
            // armeabi-v7a (32-bit ARM) dropped 2026-05-15: minSdk=24 already
            // filters out most legacy 32-bit hardware, and the duplicate
            // libgojni.so adds ~36 MB compressed to the APK. Tooling
            // (Flutter, gomobile, Go runtime) still supports it; revisit if
            // we get sideload-user complaints from the Slack release.
            abiFilters = ["arm64-v8a"]
            debugSymbolLevel 'FULL'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14 -fexceptions -frtti"
                arguments "-DANDROID_ARM_NEON=TRUE", '-DANDROID_STL=c++_shared'
            }
        }
        buildFeatures {
            buildConfig true
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(project.property('KEYSTORE_FILE'))
                storePassword project.property('KEYSTORE_PWD')
                keyAlias project.property('KEY_ALIAS')
                keyPassword project.property('KEY_PWD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "DEVELOPMENT_MODE", "true"
        }

        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            buildConfigField "boolean", "DEVELOPMENT_MODE", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

flutter {
    source = "../.."
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation fileTree(dir: "libs", include: "liblantern.aar")
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
