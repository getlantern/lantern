plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def hasRelProp = { name -> project.hasProperty(name) && project.property(name)?.toString()?.trim() }
def hasReleaseKeystore =
        hasRelProp('KEYSTORE_FILE') &&
        hasRelProp('KEYSTORE_PWD') &&
        hasRelProp('KEY_ALIAS') &&
        hasRelProp('KEY_PWD')
def sideloadSigningCertificateSha256 =
        hasRelProp('SIDELOAD_SIGNING_CERTIFICATE_SHA256')
                ? project.property('SIDELOAD_SIGNING_CERTIFICATE_SHA256').toString().trim()
                : "108f612ae55354078ec12b10bb705362840d48fa78b9262c11b6d0adeff6f289"
def sideloadUpdates = project.findProperty("lantern.sideloadUpdates") == "true"
def sideloadManifestPath = "$buildDir/generated/lantern/sideload/AndroidManifest.xml"
def generateSideloadManifest = tasks.register("generateSideloadManifest") {
    def sourceManifest = file("src/main/AndroidManifest.xml")
    def permissionAnchor = '    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />'
    def sideloadInstallPermission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
    inputs.file(sourceManifest)
    outputs.file(sideloadManifestPath)

    doLast {
        def source = sourceManifest.getText("UTF-8")
        if (!source.contains(permissionAnchor)) {
            throw new GradleException("Unable to place sideload install permission in AndroidManifest.xml")
        }
        def output = file(sideloadManifestPath)
        output.parentFile.mkdirs()
        output.setText(
                source.replace(permissionAnchor, "${permissionAnchor}\n${sideloadInstallPermission}"),
                "UTF-8"
        )
    }
}

def start = new Date(2015, 1, 1).getTime()
def now = System.currentTimeMillis()
def code = (int)((now - start) / 1000)
def stealthIconSeed = (findProperty("stealthIconSeed") ?: System.getenv("STEALTH_ICON_SEED"))?.toString()?.trim()
def generatedStealthIconResDir = layout.buildDirectory.dir("generated/stealth-icons/res")
def generatedStealthIconMetadata = layout.buildDirectory.file("generated/stealth-icons/stealth-icon-metadata.json")
def launcherIconResource = stealthIconSeed ? "@mipmap/stealth_ic_launcher" : "@mipmap/ic_launcher"
def roundLauncherIconResource = stealthIconSeed ? "@mipmap/stealth_ic_launcher_round" : "@mipmap/ic_launcher_round"

android {
    namespace = "org.getlantern.lantern"
    compileSdk = 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main {
            // Keep one Android release variant. The sideload APK opts into
            // REQUEST_INSTALL_PACKAGES with -Plantern.sideloadUpdates=true;
            // the Play AAB uses the normal manifest and omits that permission.
            if (sideloadUpdates) {
                manifest.srcFile sideloadManifestPath
            }
            jniLibs.srcDirs = ['libs']
            jniLibs.srcDirs += ['src/main/jniLibs']
            if (stealthIconSeed) {
                res.srcDirs += [generatedStealthIconResDir.get().asFile]
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // arm64-only for every artifact (APK + AAB). armeabi-v7a (32-bit) was
    // dropped: Go >=1.23.2 trips Android 8-10 seccomp on 32-bit, killing
    // libgojni.so with SIGSYS at startup (golang/go#70495 — ~54% of v9
    // crashes). Constraint: abiFilters must match the ABIs Flutter built
    // (Makefile --target-platform), or installs crash with "Could not find
    // 'libflutter.so'".

    // Use legacy packaging to help reduce apk size
    packagingOptions {
        exclude "DebugProbesKt.bin"
        jniLibs {
            useLegacyPackaging true
            // abiFilters is supposed to keep only the ABIs we ship to in
            // the APK, but some transitive AAR dependencies (notably ML
            // Kit's barcode-scanning AAR pre-unbundling) ship x86 / x86_64
            // .so files that slip past the filter — observed 5.9 MB
            // libbarhopper_v3.so + 1.2 MB libc++_shared.so + 0.7 MB
            // libnative-imagetranscoder.so under lib/x86_64/ in
            // v9.1.9-beta. Explicit excludes here strip them at packaging
            // time. armeabi-v7a is stripped too — we ship arm64 only.
            def abiExcludes = [
                "lib/x86/**",
                "lib/x86_64/**",
                "lib/armeabi/**",
                "lib/armeabi-v7a/**",
                "lib/mips/**",
                "lib/mips64/**",
            ]
            excludes += abiExcludes
        }
    }

    defaultConfig {
        applicationId = "org.getlantern.lantern"
        minSdkVersion = 24
        targetSdk = 36
        versionCode = code
        versionName = flutter.versionName
        buildConfigField "String", "SIDELOAD_SIGNING_CERTIFICATE_SHA256", "\"${sideloadSigningCertificateSha256}\""
        manifestPlaceholders += [
                launcherIcon     : launcherIconResource,
                roundLauncherIcon: roundLauncherIconResource,
        ]

        ndk {
            // arm64 only (APK + AAB) — armeabi-v7a dropped, see the comment
            // above defaultConfig (golang/go#70495 SIGSYS on 32-bit).
            abiFilters = ["arm64-v8a"]
            debugSymbolLevel 'FULL'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14 -fexceptions -frtti"
                arguments "-DANDROID_ARM_NEON=TRUE", '-DANDROID_STL=c++_shared'
            }
        }
        buildFeatures {
            buildConfig true
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(project.property('KEYSTORE_FILE'))
                storePassword project.property('KEYSTORE_PWD')
                keyAlias project.property('KEY_ALIAS')
                keyPassword project.property('KEY_PWD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "DEVELOPMENT_MODE", "true"
            buildConfigField "String", "SIDELOAD_SIGNING_CERTIFICATE_SHA256", "\"\""
        }

        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            buildConfigField "boolean", "DEVELOPMENT_MODE", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

if (sideloadUpdates) {
    tasks.matching { it.name.startsWith("process") && it.name.endsWith("MainManifest") }
            .configureEach { dependsOn(generateSideloadManifest) }
}

tasks.register("generateStealthAndroidIcons", Exec) {
    onlyIf { stealthIconSeed }
    inputs.property("stealthIconSeed", stealthIconSeed ?: "")
    outputs.dir(generatedStealthIconResDir)
    outputs.file(generatedStealthIconMetadata)
    commandLine "python3",
            "${rootProject.projectDir.parentFile}/scripts/stealth/generate_android_icons.py",
            "--seed", stealthIconSeed ?: "",
            "--output-res-dir", generatedStealthIconResDir.get().asFile.absolutePath
}

preBuild.dependsOn("generateStealthAndroidIcons")

flutter {
    source = "../.."
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation fileTree(dir: "libs", include: "liblantern.aar")
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
