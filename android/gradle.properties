org.gradle.caching=true
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
#This will prevent crashes with the Stripe SDK on Android
#DO NOT CHANGE
android.enableR8.fullMode=false

# Use Google Play Services' on-device ML Kit barcode model instead of
# bundling the model in the APK. The unbundled variant fetches the
# model from Play Services on first scan, which adds a one-time runtime
# dependency on Play Services barcode-scanning being available — but
# saves ~14 MB uncompressed (libbarhopper_v3.so across ABIs + the
# embedded .tflite assets) from every install. Critical for the
# Iranian sideload audience where bandwidth is scarce.
#
# Trade-off: first-ever QR scan triggers a Play Services model
# download (~2 MB, cached by Play Services for all apps that need it).
# Most Lantern users on Android already have Play Services installed.
# Users on de-Googled Android (LineageOS, GrapheneOS without
# microG/Play) lose QR scanning — they currently have it via the
# bundled model.
dev.steenbakker.mobile_scanner.useUnbundled=true
