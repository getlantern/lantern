buildscript {
    ext{
        hilt_version = '2.56.1'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
    }

}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Release builds run lint vital on Flutter plugin modules too. stripe_android's
// lint classpath needs com.google.android.gms:play-services-tapandpay, which no
// public repository has, so its lint vital fails though its build doesn't.
subprojects {
    if (project.name == "stripe_android") {
        tasks.named { it.startsWith("lintVital") }.configureEach {
            enabled = false
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
