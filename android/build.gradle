buildscript {
    ext{
        hilt_version = '2.56.1'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
    }

}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Release builds run lint vital on every Flutter plugin module too. Third-party
// plugins aren't ours to fix, and their lint can fail where their build doesn't:
// stripe_android's lint classpath needs a Google Pay library that isn't on a
// public repository. :app keeps its lint vital check.
subprojects {
    if (project.name != "app") {
        tasks.matching { it.name.startsWith("lintVital") }.configureEach {
            enabled = false
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
