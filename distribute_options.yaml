output: dist/
releases:
  - name: prod
    jobs:
      - name: macos-zip
        package:
          platform: macos
          target: zip
          build_args:
            dart-define:
              APP_ENV: dev

      - name: windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            dart-define:
              APP_ENV: dev

      - name: linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            dart-define:
              APP_ENV: dev

      - name: linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            dart-define:
              APP_ENV: dev
