name: stripe_ios
description: Empty stand-in for stripe_ios. Stripe checkout is Android-only, so iOS ships without the Stripe SDK.
version: 12.4.0
publish_to: none

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

# A Dart-only plugin entry, so flutter_stripe's default_package still resolves.
flutter:
  plugin:
    platforms:
      ios:
        dartPluginClass: StripeIosStub
